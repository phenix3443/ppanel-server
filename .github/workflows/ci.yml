name: CI

on:
  push:
    # Pushes to dev are covered by nightly.yml, which gates publishing on the
    # same checks; running them here too would double every dev push.
    branches: [master, main]
  pull_request:
    branches: [master, main, dev]

permissions:
  contents: read

jobs:
  # Build, vet, database-backed tests, race detector, govulncheck, generated
  # code and lint; shared with nightly.yml and release.yml.
  checks:
    uses: ./.github/workflows/checks.yml

  # master is the LTS line and dev takes the features, so the two can each
  # gain migrations. This keeps their numbering compatible; see the script for
  # what an incompatible pair does to an upgrading database. While master is
  # only behind dev (fast-forwarded), the script sees one line and skips the
  # band check.
  migration-lines:
    name: Check migration lines
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The script tells one line from two by ancestry, which a shallow
          # clone cannot answer.
          fetch-depth: 0

      - name: Check migration lines
        # 【本 fork 的 LTS 线是 main，不是 master】上游用 master 承载 LTS、
        # feature 分支放 >=3000 的迁移。我们 fork 只有 main 一条线，
        # origin/master 是切到 main 之前的陈旧遗留——拿它当基线会把全部
        # 172 个迁移都判成「只存在于这条线」，整片报错。
        env:
          LTS_REF: origin/main
          # 本 fork 只有 main 一条线（master 落后 394 个提交、无迁移，已废弃），
          # 上游那套「LTS 线 + feature 线」的分段规则在这里自相矛盾：新迁移在
          # PR 上被要求 >= 3000，合进 main 后又因「LTS 线不能有 >= 3000」失败。
          # 单线模式只保留「LTS 的迁移必须都在」这条有意义的检查。
          SINGLE_LINE: "1"
        run: |
          git fetch --quiet origin main
          ./script/check-migration-lines.sh

name: Generate and sync Swagger

on:
  pull_request:
    branches: [master, dev, main]
    paths:
      - "**/*.go"
      - "api/**/*.proto"
      - "go.mod"
      - "go.sum"
      - "ppanel.json"
      - "script/generate-swagger.sh"
      - "script/check-swagger-workflow-contract.py"
      - ".github/workflows/swagger.yaml"
  push:
    branches: [master, dev, main]
    paths:
      - "**/*.go"
      - "api/**/*.proto"
      - "go.mod"
      - "go.sum"
      - "ppanel.json"
      - "script/generate-swagger.sh"
      - "script/check-swagger-workflow-contract.py"
      - ".github/workflows/swagger.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swagger-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate Swagger documents
        run: ./script/generate-swagger.sh

      - name: Verify generated document is committed
        run: git diff --exit-code -- ppanel.json

      - name: Verify Swagger covers Hertz routes
        run: go test ./internal/transport/http/routes -run '^TestSwagger' -count=1

      - name: Verify Swagger workflow contract
        run: python3 script/check-swagger-workflow-contract.py

      - name: Checkout frontend repository
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/checkout@v4
        with:
          repository: perfect-panel/frontend
          ref: main
          token: ${{ secrets.GH_TOKEN }}
          path: frontend

      - name: Copy Swagger documents
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        run: |
          mkdir -p frontend/docs/public/swagger
          manifest="frontend/docs/public/swagger/.backend-generated"
          if [[ -f "${manifest}" ]]; then
            while IFS= read -r file; do
              rm -f "frontend/docs/public/swagger/${file}"
            done < "${manifest}"
          fi
          find build/swagger -maxdepth 1 -type f -name '*.json' -printf '%f\n' | sort > "${manifest}"
          while IFS= read -r file; do
            cp "build/swagger/${file}" frontend/docs/public/swagger/
          done < "${manifest}"

      - name: Commit frontend Swagger changes
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        working-directory: frontend
        run: |
          git add --all -- docs/public/swagger
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(api): sync Swagger from backend"
          git push

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Apple 登录</title>
</head>
<body>
<div id="appleid-signin"></div>
<script type="text/javascript" src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js"></script>
<script type="text/javascript">
    AppleID.auth.init({
        clientId: 'web.jiashus.com', // replace with your Services ID
        scope: 'name email', // optional: the requested scopes
        redirectURI: 'https://test.ppanel.dev:8443/auth/apple/callback', // replace with your callback URL
        state: 'optional-csrf-token', // optional
        usePopup: false // optional: sign in through a popup window
    });
</script>

</body>
</html>

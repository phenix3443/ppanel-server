version: "2"

run:
  timeout: 10m

linters:
  # The standard set (errcheck, govet, ineffassign, staticcheck, unused) plus
  # linters for defects this codebase has actually had, and the security
  # linters a payment and authentication server should run.
  default: standard
  enable:
    - bodyclose # unclosed HTTP response bodies
    - dupl # copy-pasted blocks
    - errorlint # %v instead of %w, == on wrapped errors
    - gocognit # functions too complex to review
    - gosec # insecure patterns: weak crypto, permissive files, injection, unbounded reads
    - misspell
    - nilerr # returning nil after checking err != nil
    - noctx # HTTP requests and database calls without a context
    - rowserrcheck # sql.Rows iterated without checking Rows.Err
    - sqlclosecheck # sql.Rows and sql.Stmt left open
    - unconvert
    - unparam
  settings:
    dupl:
      threshold: 150
    gocognit:
      min-complexity: 40
    gosec:
      excludes:
        # Unhandled errors: errcheck reports them, with its own exclusions.
        - G104
        # Integer conversions (int -> uint32 for argon2 parameters, uint64
        # byte counts to int64 columns, ...): every conversion in the tree
        # is flagged whether or not the value can overflow, 31 at the time
        # of writing, so the rule hides the findings that matter.
        - G115
        # Files opened from a variable path: the server reads the paths its
        # configuration and command line name (the configuration file, the
        # log files, TLS certificates), never a path a request supplies.
        - G304
    staticcheck:
      checks:
        - all
        # The golangci-lint defaults: naming and comment-form rules this
        # codebase does not follow.
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # Promoted selectors (l.Error for l.Logger.Error, db.Name for
        # db.Dialector.Name) read worse than the explicit embedded field.
        - -QF1008
    errorlint:
      # Comparisons against sentinel errors are checked; asserting on the
      # *xerr.CodeError type is done with errors.As.
      comparison: true
      asserts: true
      errorf: true
    # misspell has no locale set: the comments mix British and American
    # spelling, and both are correct; only genuine misspellings are reported.
  exclusions:
    generated: strict
    paths:
      - api/server/v1/server.pb.go
    rules:
      # Tests and test-support packages (…/geoiptest, …/billingtest,
      # …/subtest) hold fixture credentials, world-readable temp files,
      # listeners without a context and SQL built from table names on
      # purpose; the security linters are for the code that ships.
      - path: _test\.go$
        linters:
          - gosec
          - noctx
      - path: internal/.*/[a-z]+test/
        linters:
          - gosec
      # The authentication method configurations hold the providers' client
      # secrets and SMTP passwords by design: they are stored as JSON and
      # edited by administrators. G117 flags every such field.
      - path: internal/module/identity/entity/auth/auth\.go$
        linters:
          - gosec
        text: "G117"

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
